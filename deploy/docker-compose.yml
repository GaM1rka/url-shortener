services:
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    env_file:
      - ../.env
    environment:
      HTTP_ADDRESS: ":8081"
      STORAGE_TYPE: postgres
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-url_shortener}@postgres:5432/${POSTGRES_DB:-url_shortener}?sslmode=disable"
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-url_shortener}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-url_shortener}"
      POSTGRES_DB: "${POSTGRES_DB:-url_shortener}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
