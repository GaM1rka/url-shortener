# Запуск из корня проекта:
# docker compose -f deploy/docker-compose.swagger.yml up -d
# Swagger UI: http://localhost:8080
name: url-shortener-swagger

services:
  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.33.0
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      VALIDATOR_URL: "none"
    volumes:
      - ../api/openapi.yaml:/spec/openapi.yaml:ro
